# Host Nginx configuration for the Docker Compose deployment.
# Install as a site in /etc/nginx/sites-enabled/ after obtaining the TLS
# certificate for meet.icebrkr.space. Compose frontend stays on loopback:8088.

server {
    listen 80;
    listen [::]:80;
    server_name meet.icebrkr.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.icebrkr.space;

    ssl_certificate /etc/letsencrypt/live/meet.icebrkr.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.icebrkr.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
